services:
  postgres:
    image: postgres:16
    container_name: sprint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_DATABASE:-sprint_identity}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - sprint_postgres_data:/var/lib/postgresql/data

volumes:
  sprint_postgres_data:
    name: sprint_clothes_postgres_data
