spring:
  application:
    name: backend

  lifecycle:
    timeout-per-shutdown-phase: 20s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: ADMIN
  health:
    db:
      enabled: true

info:
  app:
    name: Sprint Clothes API
    description: API de comercio electrónico con identidad Amazon Cognito
    version: 1.0.0

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-system}]"

app:
  database:
    ddl-auto: validate
    migrations-enabled: true
  datasource:
    identity:
      url: ${IDENTITY_DATASOURCE_URL}
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: identity-pool
        maximum-pool-size: ${IDENTITY_DB_POOL_MAX_SIZE:5}
        minimum-idle: ${IDENTITY_DB_POOL_MIN_IDLE:1}
        connection-timeout: 10000
        validation-timeout: 3000
        max-lifetime: 1800000
    commerce:
      url: ${COMMERCE_DATASOURCE_URL}
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: commerce-pool
        maximum-pool-size: ${COMMERCE_DB_POOL_MAX_SIZE:10}
        minimum-idle: ${COMMERCE_DB_POOL_MIN_IDLE:2}
        connection-timeout: 10000
        validation-timeout: 3000
        max-lifetime: 1800000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  whatsapp:
    business-number: ${APP_WHATSAPP_BUSINESS_NUMBER}
  cognito:
    region: ${AWS_COGNITO_REGION}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID}
    client-id: ${AWS_COGNITO_CLIENT_ID}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}
