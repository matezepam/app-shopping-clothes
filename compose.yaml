name: sprint-clothes

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-sprint_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sprint_postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  database-init:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sprint_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      IDENTITY_DATABASE: ${IDENTITY_DATABASE:-sprint_identity}
      COMMERCE_DATABASE: ${COMMERCE_DATABASE:-sprint_commerce}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/opt/sprint/init-databases.sh"]
    volumes:
      - ./infra/postgres/init-databases.sh:/opt/sprint/init-databases.sh:ro
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_SESSION_COOKIE_HTTPONLY: "True"
      PGADMIN_CONFIG_SESSION_COOKIE_SAMESITE: "'Strict'"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 8080
      PGPASS_FILE: /pgadmin4/pgpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      database-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:8080"
    volumes:
      - sprint_pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./infra/pgadmin/pgpass.generated:/pgadmin4/pgpass:ro
    networks:
      - application
      - database
    logging: *default-logging

  backend:
    image: sprint-clothes-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      IDENTITY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${IDENTITY_DATABASE:-sprint_identity}
      COMMERCE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${COMMERCE_DATABASE:-sprint_commerce}
      DATABASE_USERNAME: ${POSTGRES_USER:-sprint_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      IDENTITY_DB_POOL_MAX_SIZE: ${IDENTITY_DB_POOL_MAX_SIZE:-5}
      IDENTITY_DB_POOL_MIN_IDLE: ${IDENTITY_DB_POOL_MIN_IDLE:-1}
      COMMERCE_DB_POOL_MAX_SIZE: ${COMMERCE_DB_POOL_MAX_SIZE:-10}
      COMMERCE_DB_POOL_MIN_IDLE: ${COMMERCE_DB_POOL_MIN_IDLE:-2}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      APP_WHATSAPP_BUSINESS_NUMBER: ${APP_WHATSAPP_BUSINESS_NUMBER:-593939051525}
      APP_PRODUCT_UPLOAD_DIRECTORY: /app/uploads/products
      AWS_COGNITO_REGION: ${AWS_COGNITO_REGION:?Set AWS_COGNITO_REGION in .env}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID:?Set AWS_COGNITO_USER_POOL_ID in .env}
      AWS_COGNITO_CLIENT_ID: ${AWS_COGNITO_CLIENT_ID:?Set AWS_COGNITO_CLIENT_ID in .env}
      AWS_COGNITO_CLIENT_SECRET: ${AWS_COGNITO_CLIENT_SECRET:-}
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/urandom
    depends_on:
      database-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    volumes:
      - ./runtime/uploads/products:/app/uploads/products
    networks:
      - application
      - database
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    image: sprint-clothes-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8088}:8080"
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  application:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  sprint_postgres_data:
    name: sprint_clothes_postgres_data
    external: true
  sprint_pgadmin_data:
    name: sprint_clothes_pgadmin_data
