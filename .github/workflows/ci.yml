name: Integración continua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar scripts de inicio y recuperacion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1' -File) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew clean test bootJar --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-compose-password
      PGADMIN_EMAIL: ci@example.invalid
      PGADMIN_PASSWORD: ci-pgadmin-password
      AWS_COGNITO_REGION: us-east-1
      AWS_COGNITO_USER_POOL_ID: us-east-1_ci_validation
      AWS_COGNITO_CLIENT_ID: ci-validation-client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - run: docker build --target runtime -t sprint-clothes-backend:test ./backend
      - run: docker build --target runtime -t sprint-clothes-frontend:test ./frontend
